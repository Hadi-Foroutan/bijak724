name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.codex/' \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.well-known/' \
            --exclude='AGENTS.md' \
            --exclude='cgi-bin/' \
            --exclude='node_modules/' \
            --exclude='public/hot' \
            --exclude='storage/' \
            --exclude='tests/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT} -o IdentitiesOnly=yes" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/"

      - name: Finalize Laravel deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
        run: |
          DEPLOY_APP_URL="${APP_URL}"

          if [ -z "${DEPLOY_APP_URL}" ]; then
            DEPLOY_APP_URL="$(sed -n 's/^APP_URL=//p' .env.example | head -n 1)"
          fi

          test -n "${DEPLOY_APP_URL}"
          ssh -i ~/.ssh/deploy_key \
            -p "${SERVER_PORT}" \
            -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "bash -s -- '${SERVER_PATH}' '${DEPLOY_APP_URL}'" <<'REMOTE'
          set -e

          deployment_path="$1"
          deployment_app_url="$2"
          cd "${deployment_path}"

          test -f .env
          grep -Eq '^APP_KEY=base64:.+' .env

          update_env_value() {
            key="$1"
            value="$2"

            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '\n%s=%s\n' "${key}" "${value}" >> .env
            fi
          }

          update_env_value APP_ENV production
          update_env_value APP_DEBUG false
          update_env_value APP_URL "${deployment_app_url}"

          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache

          trap 'php artisan up || true' EXIT
          php artisan down --retry=60 || true
          php artisan optimize:clear
          php artisan migrate --force
          php artisan generate-permissions --no-interaction
          php artisan storage:link || true
          php artisan optimize
          php artisan queue:restart
          php artisan up
          trap - EXIT
          REMOTE
