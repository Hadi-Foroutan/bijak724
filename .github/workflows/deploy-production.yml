name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, xml, zip
          tools: composer:v2
          coverage: none

      # Composer's download cache: only packages that changed in composer.lock are downloaded again.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
        run: |
          # --checksum: the checkout gives every file a new modification time, so without it all of vendor/ would be
          # uploaded on every deploy; with it only the files whose content really changed are sent.
          rsync -az --checksum --delete \
            --exclude='.codex/' \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.well-known/' \
            --exclude='AGENTS.md' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            --exclude='api.json' \
            --exclude='docs/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.js' \
            --exclude='cgi-bin/' \
            --exclude='node_modules/' \
            --exclude='public/hot' \
            --exclude='storage/' \
            --exclude='tests/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT} -o IdentitiesOnly=yes" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/"

      - name: Finalize Laravel deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          # Secrets of the `production` environment (never written in this file): the Supervisor login that restarts Reverb.
          SUPERVISOR_USER: ${{ secrets.SUPERVISOR_USER }}
          SUPERVISOR_PASSWORD: ${{ secrets.SUPERVISOR_PASSWORD }}
        run: |
          DEPLOY_APP_URL="${APP_URL}"

          if [ -z "${DEPLOY_APP_URL}" ]; then
            DEPLOY_APP_URL="$(sed -n 's/^APP_URL=//p' .env.example | head -n 1)"
          fi

          test -n "${DEPLOY_APP_URL}"

          # The arguments of the remote script, shell-quoted (a password may contain any character).
          remote_args="$(printf '%q ' "${SERVER_PATH}" "${DEPLOY_APP_URL}" "${SUPERVISOR_USER}" "${SUPERVISOR_PASSWORD}")"

          ssh -i ~/.ssh/deploy_key \
            -p "${SERVER_PORT}" \
            -o IdentitiesOnly=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "bash -s -- ${remote_args}" <<'REMOTE'
          set -e

          deployment_path="$1"
          deployment_app_url="$2"
          supervisor_user="$3"
          supervisor_password="$4"
          cd "${deployment_path}"

          test -f .env
          grep -Eq '^APP_KEY=base64:.+' .env

          update_env_value() {
            key="$1"
            value="$2"

            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '\n%s=%s\n' "${key}" "${value}" >> .env
            fi
          }

          update_env_value APP_ENV production
          update_env_value APP_DEBUG false
          update_env_value APP_URL "${deployment_app_url}"
          # The port Reverb listens on on the server (locally it stays on the default 8080 of config/reverb.php).
          update_env_value REVERB_SERVER_PORT 9004
          # Laravel sends its events straight to the local Reverb, on the same port (REVERB_PUBLISH_* in the server .env).
          update_env_value REVERB_PUBLISH_PORT 9004

          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache

          trap 'php artisan up || true' EXIT
          php artisan down --retry=60 || true
          php artisan optimize:clear
          php artisan migrate --force
          php artisan company-tables:sync --no-interaction
          # Adds the report-builder fields that are missing; fields an admin edited or turned off are left alone.
          php artisan db:seed --class=ReportFieldSeeder --force --no-interaction
          php artisan generate-permissions --no-interaction
          php artisan storage:link || true
          php artisan optimize
          php artisan up
          trap - EXIT

          # The queue workers (cron jobs, see ops/server/keep-services-alive.sh) are only told to stop: each exits after its current
          # work and the cron job starts it again with the new code.
          php artisan queue:restart

          # Reverb runs under Supervisor (program `bijak-reverb`): restarting it makes it read the new .env (port, logs, ...).
          # Without the Supervisor secrets, or if Supervisor fails, it is only sent the restart signal (Supervisor's autorestart
          # then starts it again).
          if [ -n "${supervisor_user}" ] && supervisorctl -u "${supervisor_user}" -p "${supervisor_password}" restart bijak-reverb; then
            echo "Reverb restarted by Supervisor"
          else
            echo "::warning::Reverb was not restarted through Supervisor; sending the restart signal instead"
            php artisan reverb:restart || true
          fi

          REMOTE
