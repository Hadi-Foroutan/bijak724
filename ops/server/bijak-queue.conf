;
; NOT needed with the deploy workflow: it installs cron jobs (ops/server/install-cron.sh) that keep the queue worker and
; Reverb running. Use this sample only if you prefer supervisor on a server you control fully (then remove the cron block).
; Optional sample (manual): keeps the queue worker alive. Report exports (Excel/PDF) run on the `reports` queue,
; one after another. Copy to /etc/supervisor/conf.d/, fix the path and user, then:
;   supervisorctl reread && supervisorctl update
; The deploy workflow runs `queue:restart`, and supervisor starts the worker again with the new code.
[program:bijak-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bijak/artisan queue:work --queue=reports,default --sleep=3 --tries=1 --timeout=1800 --max-time=3600
directory=/var/www/bijak
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1800
redirect_stderr=true
stdout_logfile=/var/www/bijak/storage/logs/queue-worker.log
